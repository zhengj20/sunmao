services:
  mysql:
    image: mysql:8.0
    container_name: sunmao-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-sunmao123}
      MYSQL_DATABASE: ${DB_NAME:-sunmao}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --default-time-zone=+08:00
    ports:
      - "3306:3306"
    volumes:
      - sunmao-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${DB_PASSWORD:-sunmao123}"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  sunmao-mysql-data:
